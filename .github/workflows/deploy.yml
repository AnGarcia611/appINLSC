# Publica la app en GitHub Pages en cada push a main.
# En Pages no hay servidor propio: la sincronización usa el relé MQTT (src/shared/relay.ts), por eso VITE_SYNC=relay.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Pruebas del motor de reconocimiento de señas (manos sintéticas, sin cámara).
      - run: npm test
      # Verifica que la tablet puede conectarse por el relé (servidores MQTT públicos). No bloquea la publicación:
      # desde los servidores de GitHub esos brokers fallan a menudo aunque desde redes normales funcionen
      # (4-oct: 3 de 4 intentos fallidos en GitHub, todos correctos en local). Si falla, queda una advertencia en el resumen.
      - name: Prueba del relé (no bloquea)
        continue-on-error: true
        run: |
          npm run test:sync || (sleep 20 && npm run test:sync) || {
            echo "::warning title=Relé MQTT::La prueba del relé falló desde GitHub. Compruebe la conexión tablet ↔ panel en https://inlscasiste.store (o con npm run test:sync en local)."
            exit 1
          }
      # prebuild copia el wasm de MediaPipe a public/vision (los modelos .task están versionados).
      - run: npm run build
        env:
          VITE_SYNC: relay
          # Envío automático de la página de captura (captura-mail/). Si el servicio no responde, la página ofrece el envío manual.
          VITE_CAPTURE_URL: https://captura.inlscasiste.store/captura
          # Dominio propio (inlscasiste.store): la app se sirve desde la raíz.
          BASE_PATH: /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
